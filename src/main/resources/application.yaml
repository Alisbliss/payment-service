server:
  port: 8084

spring:
  application:
    name: payment-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/paymentdb}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        max.block.ms: 5000
    topic:
      create-payment: ${KAFKA_TOPIC_CREATE_PAYMENT:create-payment}

order-service:
  url: ${ORDER_SERVICE_URL:http://order-service:8083}

random-api:
  url: ${RANDOM_API_URL:https://www.randomnumberapi.com/api/v1.0}

resilience4j:
  circuitbreaker:
    instances:
      orderService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
      randomApi:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      orderService:
        timeout-duration: 3s
      randomApi:
        timeout-duration: 3s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
